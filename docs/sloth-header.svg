<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="40%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#060810"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5cff8f" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#00f5ff" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#5cff8f" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5cff8f"/>
      <stop offset="40%" stop-color="#00f5ff"/>
      <stop offset="85%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowTitle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowLime" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowPurple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#00f5ff" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
    }
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif;
      font-weight: 900;
      letter-spacing: 4px;
    }
    .tagline {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-weight: 700;
      letter-spacing: 2px;
    }
  </style>

  <!-- Main Chassis / Window Container -->
  <rect x="8" y="8" width="884" height="224" rx="18" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.8" filter="url(#cardShadow)"/>

  <!-- Subtle Cyber Grid in Background -->
  <g opacity="0.06" stroke="#00f5ff" stroke-width="0.8">
    <line x1="20" y1="46" x2="880" y2="46"/>
    <line x1="20" y1="95" x2="880" y2="95"/>
    <line x1="20" y1="145" x2="880" y2="145"/>
    <line x1="20" y1="195" x2="880" y2="195"/>
    <line x1="240" y1="10" x2="240" y2="230"/>
    <line x1="460" y1="10" x2="460" y2="230"/>
    <line x1="680" y1="10" x2="680" y2="230"/>
  </g>

  <!-- TOP OS WINDOW BAR -->
  <path d="M 8,26 A 18,18 0 0 1 26,8 L 874,8 A 18,18 0 0 1 892,26 L 892,42 L 8,42 Z" fill="#0b101c" opacity="0.95"/>
  <line x1="8" y1="42" x2="892" y2="42" stroke="#1e293b" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="32" cy="25" r="5.5" fill="#ff5f56" opacity="0.9"/>
  <circle cx="49" cy="25" r="5.5" fill="#ffbd2e" opacity="0.9"/>
  <circle cx="66" cy="25" r="5.5" fill="#27c93f" opacity="0.9"/>

  <!-- Window Header Title -->
  <text x="450" y="29" class="mono" font-size="11" fill="#94a3b8" text-anchor="middle" letter-spacing="1.8">
    SLOTH-OS · NAP_KERNEL_v1.0 · THE ANTI-PRODUCTIVITY SUITE
  </text>

  <!-- Status Pill Right -->
  <g transform="translate(712, 16)">
    <rect x="0" y="0" width="164" height="18" rx="9" fill="#052417" stroke="#22c55e" stroke-width="0.9"/>
    <circle cx="11" cy="9" r="3.5" fill="#22c55e" filter="url(#glowLime)"/>
    <text x="21" y="12.5" class="mono" font-size="9.5" fill="#86efac" font-weight="600" letter-spacing="0.8">LOCAL AI · 0 B LEAKED</text>
  </g>

  <!-- LEFT: HANGING SLOTH ARTWORK -->
  <g transform="translate(25, 42)">
    <!-- Glowing Jungle Cable / Cyber Vine -->
    <path d="M 10,22 Q 105,38 210,18" stroke="#334155" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 10,22 Q 105,38 210,18" stroke="#5cff8f" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="12 6" fill="none" filter="url(#glowLime)"/>

    <!-- Vine Leaves -->
    <path d="M 35,24 Q 42,12 50,22 Q 42,26 35,24 Z" fill="#22c55e" opacity="0.8"/>
    <path d="M 175,22 Q 185,10 192,20 Q 183,25 175,22 Z" fill="#22c55e" opacity="0.8"/>

    <!-- Sloth Arms & Claws Hooked to Vine -->
    <!-- Left Arm -->
    <path d="M 90,62 Q 82,38 88,27" stroke="#8a7055" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 85,25 Q 88,18 92,24 M 89,25 Q 92,17 95,23" stroke="#e2d5c3" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <!-- Right Arm -->
    <path d="M 126,60 Q 134,36 128,25" stroke="#8a7055" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 125,24 Q 128,17 132,23 M 129,24 Q 132,16 135,22" stroke="#e2d5c3" stroke-width="2.2" stroke-linecap="round" fill="none"/>

    <!-- Sloth Torso -->
    <ellipse cx="108" cy="74" rx="35" ry="25" fill="#8a7055"/>
    <ellipse cx="108" cy="77" rx="23" ry="16" fill="#baa288"/>

    <!-- Sloth Back Leg -->
    <path d="M 78,74 Q 68,54 74,32" stroke="#786149" stroke-width="7" stroke-linecap="round" fill="none"/>

    <!-- Sloth Head -->
    <circle cx="145" cy="68" r="21" fill="#8a7055"/>
    <!-- Face Mask -->
    <ellipse cx="147" cy="69" rx="15" ry="13" fill="#e5d7c5"/>
    <!-- Eye Markings -->
    <ellipse cx="143" cy="67" rx="5.5" ry="3.8" fill="#543e2b" transform="rotate(-15 143 67)"/>
    <ellipse cx="154" cy="67" rx="5.5" ry="3.8" fill="#543e2b" transform="rotate(15 154 67)"/>
    <!-- Sleepy Curved Eyes -->
    <path d="M 140,68 Q 143,71 146,68" stroke="#26190f" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M 151,68 Q 154,71 157,68" stroke="#26190f" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <!-- Nose & Smile -->
    <ellipse cx="148" cy="74" rx="3" ry="2.2" fill="#26190f"/>
    <path d="M 145,77 Q 148,79 151,77" stroke="#26190f" stroke-width="1.3" fill="none" stroke-linecap="round"/>

    <!-- Cyber Headband / Headphones on Sloth -->
    <path d="M 130,58 Q 146,50 162,58" stroke="#00f5ff" stroke-width="2.8" fill="none" filter="url(#glowCyan)"/>
    <rect x="127" y="57" width="5" height="10" rx="2" fill="#00f5ff" filter="url(#glowCyan)"/>
    <rect x="160" y="57" width="5" height="10" rx="2" fill="#00f5ff" filter="url(#glowCyan)"/>

    <!-- Floating Neon Sleep 'Z's -->
    <text x="174" y="50" class="mono" font-size="13" font-weight="bold" fill="#00f5ff" filter="url(#glowCyan)">z</text>
    <text x="188" y="37" class="mono" font-size="17" font-weight="bold" fill="#5cff8f" filter="url(#glowLime)">Z</text>
    <text x="204" y="22" class="mono" font-size="22" font-weight="bold" fill="#c084fc" filter="url(#glowPurple)">Z</text>
  </g>

  <!-- RIGHT: MAIN BRANDING & DETAILS -->
  <g transform="translate(258, 52)">
    <!-- Big Cyber Title -->
    <text x="0" y="52" class="brand-title" font-size="50" fill="url(#titleGrad)" filter="url(#glowTitle)">SLOTH-OS</text>

    <!-- Tagline -->
    <text x="2" y="80" class="tagline" font-size="12.5" fill="#5cff8f">
      ZERO-EFFORT CHORE ENGINE · 100% LOCAL AI DESKTOP
    </text>

    <!-- Subtitle -->
    <text x="2" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">
      Runs on your own machine with Ollama while you nap · No cloud · No API keys · Zero telemetry
    </text>

    <!-- BOTTOM TELEMETRY CHIPS -->
    <g transform="translate(2, 122)">
      <!-- Chip 1: Laziness Meter -->
      <rect x="0" y="0" width="138" height="24" rx="6" fill="#071f14" stroke="#22c55e" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#22c55e" filter="url(#glowLime)"/>
      <text x="22" y="16" class="mono" font-size="10" font-weight="600" fill="#86efac">LAZINESS: 100%</text>

      <!-- Chip 2: Nap.exe -->
      <rect x="148" y="0" width="144" height="24" rx="6" fill="#081e30" stroke="#00f5ff" stroke-width="1"/>
      <circle cx="160" cy="12" r="3.5" fill="#00f5ff" filter="url(#glowCyan)"/>
      <text x="170" y="16" class="mono" font-size="10" font-weight="600" fill="#7dd3fc">NAP.EXE: RUNNING</text>

      <!-- Chip 3: Offline Private -->
      <rect x="302" y="0" width="146" height="24" rx="6" fill="#1e0e30" stroke="#c084fc" stroke-width="1"/>
      <circle cx="314" cy="12" r="3.5" fill="#c084fc" filter="url(#glowPurple)"/>
      <text x="324" y="16" class="mono" font-size="10" font-weight="600" fill="#e9d5ff">100% OFFLINE AI</text>

      <!-- Chip 4: Ollama Native -->
      <rect x="458" y="0" width="144" height="24" rx="6" fill="#241405" stroke="#f59e0b" stroke-width="1"/>
      <circle cx="470" cy="12" r="3.5" fill="#f59e0b"/>
      <text x="480" y="16" class="mono" font-size="10" font-weight="600" fill="#fde68a">OLLAMA NATIVE</text>
    </g>
  </g>
</svg>
